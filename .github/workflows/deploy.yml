name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Note whether AI design generation is enabled
        run: |
          if [ -z "${{ vars.VITE_DESIGN_API_URL }}" ]; then
            echo "::notice::Repository variable VITE_DESIGN_API_URL is not set. DESIGN WITH RENA HOME shows 'AI coming soon'. See README."
          else
            echo "AI design API: ${{ vars.VITE_DESIGN_API_URL }}"
          fi

      # The build uses a relative base path (vite.config.js) and then verifies the paths in dist/
      # (scripts/check-dist.mjs), so the same output works on the GitHub Pages URL and a custom domain.
      - run: npm run build
        env:
          # Public URL of the Cloudflare Worker (Settings → Secrets and variables → Actions → Variables).
          # Not a secret: it is visible in the website. Never put API tokens in VITE_ variables.
          VITE_DESIGN_API_URL: ${{ vars.VITE_DESIGN_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
